specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Lennar
providerId: lennar
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - FinOps
  - FOCUS
  - Homebuilder
  - Real Estate
  - Fortune 500
  - Mortgage
description: 'FOCUS-aligned FinOps scaffold for Lennar: partner-only API access with no public per-call
  pricing. Consumer-side telemetry mirrors the Azure APIM subscription used to access Lennar APIs.'
notes: Pricing is partner-contract driven; meters below describe the consumer-side observation surface
  rather than billable Lennar line items.
sources:
  - https://azu-lndscapmu01e.portal.azure-api.net/
  - https://www.lennar.com
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Lennar Corporation
serviceCategory: Real Estate / API
billingModel:
  pricingCategory: Custom Contract
  billingFrequency: Per-Invoice
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Adjustment
focusColumns:
  ServiceName: Lennar API
  ServiceCategory: Real Estate / API
  ProviderName: Lennar
  PublisherName: Lennar Corporation
  InvoiceIssuerName: Lennar Corporation
  BillingCurrency: USD
meters:
  - name: api_requests
    unit: request
    aggregation: sum
    dimensions:
      - api
      - subscription_key
      - environment
  - name: partner_fees
    unit: month
    aggregation: sum
    dimensions:
      - contract
principles:
  - name: Visibility
    description: Use Azure API Management analytics on the Lennar subscription to observe call volume
      and error rates; Lennar does not expose a separate billing API.
  - name: Allocation
    description: Issue distinct APIM subscription keys per consuming team (sales, mortgage, title) to
      attribute call volume and any partner-contract draw.
  - name: Optimization
    description: Cache reference data (community / floor-plan lookups) and batch mortgage events to stay
      under partner-subscription quotas.
  - name: Accountability
    description: Assign a Lennar partner contract owner who reviews APIM call volume and partner-contract
      consumption monthly.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
