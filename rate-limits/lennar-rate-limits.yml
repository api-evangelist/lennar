specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Lennar
providerId: lennar
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Rate Limiting
  - Homebuilder
  - Real Estate
  - Fortune 500
  - Mortgage
description: Lennar's APIs are fronted by Azure API Management. APIM's standard rate-limit and quota
  policies are typically applied per subscription key, but Lennar does not publish specific request-per-second
  or daily-quota numbers. Limits are configured in the partner subscription and surfaced in the developer
  portal after sign-in.
notes: No public rate-limit documentation found. Numeric ceilings are managed inside the Azure APIM tenant
  and must be confirmed with Lennar's partner team.
sources:
  - https://azu-lndscapmu01e.portal.azure-api.net/
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: Partner Subscription Limit (Azure APIM)
    scope: subscription-key
    metric: varies
    limit: see partner subscription / APIM policy
    notes: Set per partner subscription via Azure API Management rate-limit and quota policies.
policies:
  - name: Backoff Strategy
    description: Clients should implement exponential backoff with jitter, honoring Retry-After when
      returned by APIM.
  - name: Subscription-Scoped Limits
    description: Throttling is enforced on the Azure APIM subscription key; raise via the Lennar partner
      contact to adjust quotas.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
