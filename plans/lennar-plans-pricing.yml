description: Lennar exposes APIs through an Azure API Management developer portal that requires sign-in
  and partner approval. There is no public, self-serve plans/pricing page; access (Lennar Mortgage Fannie
  Mae integration, internal partner APIs) is granted through Lennar's partner program rather than published
  tiers.
notes: No public pricing page found. Plan below is a placeholder for partner / approved integrator engagement;
  pricing and quotas must be confirmed with Lennar.
sources:
  - https://azu-lndscapmu01e.portal.azure-api.net/
  - https://www.lennar.com
plans:
  - id: lennar-partner
    name: Partner / Approved Integrator
    type: enterprise
    description: API access for approved Lennar partners and integrators (mortgage GSE flows, sales /
      title / closing partners). Onboarding and pricing are handled through Lennar's partner programs
      rather than self-serve.
    entries:
      - label: Partner API Access
        name: api_access
        type: subscription
        metric: contract
        limit: -1
        timeFrame: month
        geo: US
        unit: 1
        price: contact provider
        userMultiplied: false
    elements:
      - name: Azure API Management Developer Portal
      - name: Lennar Partner Onboarding
      - name: Lennar Mortgage Fannie Mae Integration
      - name: Lennar Corporation Developer Portal
